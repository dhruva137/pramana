databases:
  - name: pramana-db
    databaseName: pramana
    plan: free

services:
  - type: web
    name: pramana-core
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && cd console && npm ci && npm run build && cd .."
    startCommand: "uvicorn core.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: pramana-db
          property: connectionString
      - key: PRAMANA_ENV
        value: demo
      - key: MOCK_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mock
      - key: RAZORPAY_KEY_SECRET
        value: mock_secret_for_demo
      - key: PRAMANA_SEAL_KID
        value: seal-2026-09
      - key: PRAMANA_PROOF_KID
        value: proof-2026-09
      - key: ALLOW_ORIGINS
        value: "*"
      - key: SEED_DEMO_ON_BOOT
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Optional separate static site — not required when console/dist is served by pramana-core
  - type: web
    name: pramana-console
    runtime: static
    plan: free
    rootDir: console
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://pramana-core.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: pramana-warm
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: "pip install httpx"
    startCommand: "python -c \"import httpx,os;httpx.get(os.environ['WARM_URL'],timeout=30)\""
    envVars:
      - key: WARM_URL
        value: https://pramana-core.onrender.com/healthz
